<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="DevStudio">
<meta name="theme-color" content="#0b0c10">
<title>Pocket Dev Studio</title>
<style>
  :root {
    --bg-dark: #0b0c10;
    --panel-bg: #1f2833;
    --panel-2: #111820;
    --border: #45a29e;
    --accent: #66fcf1;
    --gold: #ffd166;
    --danger: #ef476f;
    --good: #06d6a0;
    --muted: #9aa5b1;
    --font: 'Courier New', Courier, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  input { -webkit-user-select: text; user-select: text; }
  html, body { height: 100%; }
  body {
    background-color: var(--bg-dark);
    color: #fff;
    font-family: var(--font);
    display: flex;
    flex-direction: column;
    align-items: center;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    padding: calc(env(safe-area-inset-top) + 4px) 8px calc(env(safe-area-inset-bottom) + 4px) 8px;
    gap: 6px;
  }
  #header {
    width: 100%;
    max-width: 480px;
    background: var(--panel-bg);
    border: 2px solid var(--border);
    border-radius: 6px;
    padding: 5px 8px;
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 2px 8px;
    font-size: 0.78rem;
    font-weight: bold;
    color: var(--accent);
    flex-shrink: 0;
  }
  #header .r2 { color: #fff; }
  #btn-speed { grid-row: 1 / span 2; grid-column: 2; padding: 4px 10px; font-size: 0.8rem; min-width: 64px; }
  #game-viewport {
    width: min(100%, 480px, calc(40vh * 4 / 3));
    width: min(100%, 480px, calc(40dvh * 4 / 3));
    aspect-ratio: 4 / 3;
    background: #111;
    border: 3px solid var(--border);
    border-radius: 8px;
    position: relative;
    box-shadow: 0 4px 20px rgba(102, 252, 241, 0.2);
    flex-shrink: 0;
    overflow: hidden;
  }
  canvas { width: 100%; height: 100%; image-rendering: pixelated; display: block; }
  #ui-container {
    width: 100%;
    max-width: 480px;
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
  }
  .tab-pane {
    flex: 1;
    min-height: 0;
    background: var(--panel-bg);
    border: 2px solid var(--border);
    border-radius: 6px;
    padding: 10px;
    display: none;
    flex-direction: column;
    gap: 7px;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    font-size: 0.82rem;
  }
  .tab-pane.active { display: flex; }
  nav {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 5px;
    width: 100%;
    max-width: 480px;
    flex-shrink: 0;
  }
  button, select, input {
    background: #0f141c;
    color: #fff;
    border: 1px solid var(--border);
    padding: 8px;
    border-radius: 4px;
    font-family: inherit;
    font-size: 0.8rem;
    font-weight: bold;
  }
  select, input { font-size: 16px; width: 100%; }
  button { cursor: pointer; }
  button:active:not(:disabled) { background: var(--border); color: #000; }
  button:disabled { opacity: 0.4; }
  .btn-accent { background: var(--border); color: #000; }
  .btn-accent:active:not(:disabled) { background: var(--accent); }
  .btn-gold { color: var(--gold); border-color: var(--gold); }
  .btn-danger { color: var(--danger); border-color: var(--danger); }
  .btn-sm { padding: 4px 7px; font-size: 0.7rem; }
  .nav-btn { font-size: 0.62rem; padding: 10px 1px; }
  .nav-btn.active { background: var(--border); color: #000; }
  label { font-size: 0.72rem; color: var(--muted); margin-bottom: -4px; }
  .row { display: flex; justify-content: space-between; align-items: center; gap: 6px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 5px; }
  .hl { color: var(--accent); font-weight: bold; }
  .gold { color: var(--gold); }
  .muted { color: var(--muted); }
  .bad { color: var(--danger); }
  .good { color: var(--good); }
  .note { font-size: 0.74rem; color: #ccc; line-height: 1.45; background: var(--panel-2); border-radius: 4px; padding: 6px 8px; }
  .card { background: var(--panel-2); border-radius: 5px; padding: 7px 8px; display: flex; flex-direction: column; gap: 5px; font-size: 0.75rem; }
  .card .btns { display: flex; gap: 5px; flex-wrap: wrap; }
  .sec { font-weight: bold; color: var(--accent); margin-top: 4px; }
  .bar { height: 8px; background: #000; border-radius: 3px; overflow: hidden; flex: 1; }
  .bar > div { height: 100%; }
  .statrow { display: flex; align-items: center; gap: 6px; font-size: 0.72rem; }
  .statrow span:first-child { width: 72px; }
  .statrow span:last-child { width: 34px; text-align: right; }
  /* Modal */
  #modal {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.82);
    display: none; justify-content: center; align-items: center;
    z-index: 50; padding: 16px;
  }
  #modal.show { display: flex; }
  .modal-card {
    background: var(--panel-bg);
    border: 3px solid var(--gold);
    border-radius: 8px;
    padding: 14px;
    width: 100%;
    max-width: 420px;
    max-height: 85dvh;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 10px;
    font-size: 0.8rem;
  }
  .modal-card h3 { color: var(--gold); text-align: center; }
  #modal-btns { display: flex; flex-direction: column; gap: 6px; }
  .rev { display: flex; justify-content: space-between; gap: 8px; background: var(--panel-2); padding: 5px 7px; border-radius: 4px; font-size: 0.74rem; }
  .rev b { color: var(--gold); min-width: 22px; text-align: right; }
  .big { font-size: 1.6rem; font-weight: bold; text-align: center; color: var(--accent); }
  .opt { text-align: left; width: 100%; line-height: 1.45; font-weight: normal; }
  .opt b { color: var(--accent); }
  .mini { font-size: 0.7rem; }
</style>
</head>
<body>

<div id="header">
  <div><span id="cal-text">Y1 M1 W1</span> · Rank <span id="rank-text">1</span> <span class="muted" id="rank-exp"></span></div>
  <button id="btn-speed" onclick="cycleSpeed()">▶ 1x</button>
  <div class="r2"><span class="gold">$<span id="gold-text">0</span></span> · <span id="fans-text">0</span> fans · <span class="hl"><span id="rp-text">0</span> RP</span></div>
</div>

<div id="game-viewport">
  <canvas id="screen" width="320" height="240"></canvas>
</div>

<div id="ui-container">
  <!-- DEV -->
  <div id="tab-dev" class="tab-pane active">
    <div class="row">
      <span id="dev-status" class="hl">Studio Idle</span>
      <button id="btn-boost" class="btn-sm btn-gold" disabled onclick="useBoost()">⚡ Assistant Boost</button>
    </div>
    <div id="dev-setup" style="display:flex; flex-direction:column; gap:7px;">
      <input id="inp-title" maxlength="24" placeholder="Game title (optional)" autocomplete="off">
      <label>Genre</label>
      <select id="sel-genre" onchange="updatePreview()"></select>
      <label>Theme</label>
      <select id="sel-theme" onchange="updatePreview()"></select>
      <label>Platform</label>
      <select id="sel-platform" onchange="updatePreview()"></select>
      <label>Publisher</label>
      <select id="sel-pub" onchange="updatePreview()"></select>
      <div class="grid2">
        <div style="display:flex;flex-direction:column;gap:7px;"><label>Budget</label><select id="sel-budget" onchange="updatePreview()"></select></div>
        <div style="display:flex;flex-direction:column;gap:7px;"><label>Focus</label><select id="sel-focus" onchange="updatePreview()"></select></div>
      </div>
      <label>Business model</label>
      <select id="sel-monet" onchange="updatePreview()"></select>
      <div id="dev-preview" class="note"></div>
      <div class="grid2">
        <button class="btn-accent" onclick="startDevelopment()">Begin Production</button>
        <button onclick="openContracts()">Contract Work</button>
      </div>
    </div>
    <div id="dev-progress" style="display:none; flex-direction:column; gap:6px;">
      <div class="note" id="dev-info"></div>
      <div class="statrow"><span>Phase</span><div class="bar"><div id="bar-phase" style="background:var(--gold);width:0%"></div></div><span id="val-phase"></span></div>
      <div id="dev-stats"></div>
    </div>
  </div>

  <!-- LIVE OPS -->
  <div id="tab-live" class="tab-pane"></div>

  <!-- STAFF -->
  <div id="tab-staff" class="tab-pane"></div>

  <!-- LAB -->
  <div id="tab-market" class="tab-pane"></div>
  <div id="tab-lab" class="tab-pane"></div>

  <!-- STUDIO -->
  <div id="tab-studio" class="tab-pane"></div>
</div>

<nav>
  <button class="nav-btn active" data-tab="dev" onclick="switchTab('dev')">Dev</button>
  <button class="nav-btn" data-tab="live" onclick="switchTab('live')">Live</button>
  <button class="nav-btn" data-tab="staff" onclick="switchTab('staff')">Staff</button>
  <button class="nav-btn" data-tab="market" onclick="switchTab('market')">Market</button>
  <button class="nav-btn" data-tab="lab" onclick="switchTab('lab')">Lab</button>
  <button class="nav-btn" data-tab="studio" onclick="switchTab('studio')">Studio</button>
</nav>

<div id="modal"><div class="modal-card"><div id="modal-body"></div><div id="modal-btns"></div></div></div>

<script>
'use strict';

/* =========================================================
   HELPERS
   ========================================================= */
const rnd = (a, b) => a + Math.random() * (b - a);
const ri = (a, b) => Math.floor(rnd(a, b + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const fmt = n => Math.round(n).toLocaleString();
const money = n => (n < 0 ? '-$' : '$') + fmt(Math.abs(n));
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const $ = id => document.getElementById(id);
function hashStr(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }

/* =========================================================
   AUDIO (8-bit Web Audio)
   ========================================================= */
let audioCtx = null;
function tone(freq, dur, type, vol, slideTo, delay) {
  const t0 = audioCtx.currentTime + (delay || 0);
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type || 'square';
  osc.frequency.setValueAtTime(freq, t0);
  if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
  gain.gain.setValueAtTime(vol || 0.08, t0);
  gain.gain.linearRampToValueAtTime(0, t0 + dur);
  osc.connect(gain); gain.connect(audioCtx.destination);
  osc.start(t0); osc.stop(t0 + dur + 0.02);
}
function playSound(type) {
  if (!STATE || !STATE.settings.sound) return;
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    switch (type) {
      case 'hit': tone(320, 0.07, 'triangle', 0.06, 90); break;
      case 'pop': tone(150, 0.16, 'square', 0.12, 700); break;
      case 'coin': tone(988, 0.07, 'square', 0.07); tone(1319, 0.14, 'square', 0.07, null, 0.07); break;
      case 'error': tone(180, 0.18, 'sawtooth', 0.07, 110); break;
      case 'level': [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.09, 'square', 0.06, null, i * 0.07)); break;
      case 'fanfare': [523, 659, 784, 659, 784, 1047].forEach((f, i) => tone(f, 0.13, 'sine', 0.12, null, i * 0.11)); break;
      case 'click': tone(660, 0.03, 'square', 0.04); break;
    }
  } catch (e) {}
}

/* =========================================================
   GAME DATA
   ========================================================= */
const STATS = ['Play', 'Impact', 'Retention', 'Craze'];
const STAT_COLORS = ['#4cc9f0', '#f72585', '#06d6a0', '#ffd166'];

const ROLES = {
  'Planner':    { main: 3, sub: 0, color: '#f72585' },
  'Programmer': { main: 0, sub: 2, color: '#4cc9f0' },
  'Designer':   { main: 1, sub: 3, color: '#9d4edd' },
  'Networker':  { main: 2, sub: 0, color: '#4361ee' },
  'Sound Eng.': { main: 3, sub: 1, color: '#f8961e' }
};
const ROLE_NAMES = Object.keys(ROLES);

// w = stat weights [Play, Impact, Retention, Craze]
const GENRES = [
  { n: 'Adventure',      w: [1.0, 1.1, 0.9, 1.0], cost: 1000, rp: 0,  rank: 1 },
  { n: 'Minigames',      w: [1.2, 0.9, 0.9, 1.0], cost: 500,  rp: 0,  rank: 1, drain: 0.5 },
  { n: 'Card Game',      w: [1.0, 0.8, 1.3, 0.9], cost: 800,  rp: 0,  rank: 1 },
  { n: 'Escape Game',    w: [1.1, 1.0, 0.8, 1.1], cost: 900,  rp: 0,  rank: 1 },
  { n: 'Management Sim', w: [1.1, 0.8, 1.2, 0.9], cost: 1200, rp: 0,  rank: 1 },
  { n: 'Fitness',        w: [1.2, 0.9, 1.0, 0.9], cost: 1000, rp: 0,  rank: 1 },
  { n: 'Puzzle',         w: [1.3, 0.8, 1.0, 0.9], cost: 700,  rp: 6,  rank: 1 },
  { n: 'Quiz',           w: [1.0, 0.8, 1.0, 1.2], cost: 600,  rp: 6,  rank: 2 },
  { n: 'Rhythm',         w: [1.0, 1.0, 0.8, 1.3], cost: 1500, rp: 10, rank: 3 },
  { n: 'Visual Novel',   w: [0.8, 1.3, 1.0, 1.0], cost: 1200, rp: 10, rank: 3 },
  { n: 'Board Game',     w: [1.1, 0.8, 1.2, 0.9], cost: 900,  rp: 12, rank: 4 },
  { n: 'Action',         w: [1.3, 1.1, 0.8, 0.9], cost: 2500, rp: 16, rank: 5 },
  { n: 'Sports',         w: [1.2, 1.0, 0.9, 1.0], cost: 2500, rp: 16, rank: 6 },
  { n: 'Racing',         w: [1.2, 1.2, 0.8, 0.9], cost: 3000, rp: 20, rank: 7 },
  { n: 'Strategy',       w: [1.1, 0.9, 1.2, 0.9], cost: 3000, rp: 22, rank: 8 },
  { n: 'RPG',            w: [1.0, 1.1, 1.2, 1.0], cost: 4000, rp: 26, rank: 10 },
  { n: 'MMO',            w: [0.9, 1.1, 1.4, 1.0], cost: 8000, rp: 40, rank: 14 }
];
const THEMES = [
  { n: 'Detective', rp: 0, rank: 1 }, { n: 'Animal', rp: 0, rank: 1 }, { n: 'Apartment', rp: 0, rank: 1 },
  { n: 'Office Worker', rp: 0, rank: 1 }, { n: 'Tennis', rp: 0, rank: 1 }, { n: 'Seaweed', rp: 0, rank: 1 },
  { n: 'Cooking', rp: 5, rank: 1 }, { n: 'School', rp: 6, rank: 2 }, { n: 'Ninja', rp: 8, rank: 3 },
  { n: 'Pirate', rp: 8, rank: 3 }, { n: 'Dinosaur', rp: 10, rank: 4 }, { n: 'Idol', rp: 12, rank: 5 },
  { n: 'Space', rp: 12, rank: 5 }, { n: 'Robot', rp: 14, rank: 6 }, { n: 'Horror', rp: 14, rank: 6 },
  { n: 'Samurai', rp: 16, rank: 7 }, { n: 'Fantasy', rp: 18, rank: 8 }, { n: 'Zombie', rp: 18, rank: 9 },
  { n: 'Cyberpunk', rp: 24, rank: 11 }, { n: 'Time Travel', rp: 30, rank: 13 }

const PLATFORMS = [
  { n: 'Feature Phone',  lic: 0,      fee: 1000,  peak: 0.8, year: -1, decline: 2,  end: 5,  arpu: 1.5, drain: 1.0, hp: 0.8, rank: 1,  fav: ['Quiz', 'Minigames', 'Puzzle'] },
  { n: 'Web Browser',    lic: 0,      fee: 500,   peak: 0.7, year: -1, decline: 6,  end: 12, arpu: 1.2, drain: 0.8, hp: 0.7, rank: 1,  fav: ['Card Game', 'Board Game', 'Management Sim'] },
  { n: 'Smartphone',     lic: 0,      fee: 4000,  peak: 1.6, year: 0,  decline: 0,  end: 0,  arpu: 3.0, drain: 1.4, hp: 1.0, rank: 1,  fav: ['Puzzle', 'Minigames', 'Card Game', 'Rhythm'] },
  { n: 'PC',             lic: 8000,   fee: 6000,  peak: 1.1, year: -1, decline: 0,  end: 0,  arpu: 4.0, drain: 1.0, hp: 1.2, rank: 1,  fav: ['Strategy', 'MMO', 'Management Sim', 'Visual Novel'] },
  { n: 'Tablet',         lic: 12000,  fee: 6000,  peak: 1.3, year: 2,  decline: 8,  end: 14, arpu: 3.5, drain: 1.2, hp: 1.1, rank: 3,  fav: ['Adventure', 'Escape Game', 'Board Game'] },
  { n: 'Pocket Console', lic: 30000,  fee: 12000, peak: 1.8, year: 3,  decline: 8,  end: 11, arpu: 5.0, drain: 1.2, hp: 1.3, rank: 5,  fav: ['RPG', 'Action', 'Adventure'] },
  { n: 'Cloud Console',  lic: 50000,  fee: 20000, peak: 2.4, year: 4,  decline: 0,  end: 0,  arpu: 5.0, drain: 1.3, hp: 1.5, rank: 8,  fav: ['Action', 'Racing', 'Sports', 'MMO'] },
  { n: 'Smart TV',       lic: 25000,  fee: 10000, peak: 1.5, year: 5,  decline: 10, end: 15, arpu: 4.0, drain: 1.1, hp: 1.2, rank: 6,  fav: ['Quiz', 'Fitness', 'Board Game', 'Sports'] },
  { n: 'VR Headset',     lic: 80000,  fee: 30000, peak: 3.0, year: 6,  decline: 0,  end: 0,  arpu: 7.0, drain: 1.6, hp: 1.8, rank: 11, fav: ['Fitness', 'Rhythm', 'Action', 'Escape Game'] },
  { n: 'Smart Glasses',  lic: 120000, fee: 40000, peak: 3.5, year: 9,  decline: 0,  end: 0,  arpu: 8.0, drain: 1.5, hp: 1.9, rank: 14, fav: ['Adventure', 'Fitness', 'Escape Game'] }
];
const G = Object.fromEntries(GENRES.map(g => [g.n, g]));
const T = Object.fromEntries(THEMES.map(t => [t.n, t]));
const P = Object.fromEntries(PLATFORMS.map(p => [p.n, p]));

const PUBLISHERS = [
  { n: 'Self-publish',       adv: 0,     cut: 0,    boost: 1.0,  rank: 1,  target: 0,  fav: [] },
  { n: 'Brightleaf Games',   adv: 6000,  cut: 0.25, boost: 1.25, rank: 1,  target: 20, fav: ['Puzzle', 'Minigames', 'Card Game', 'Quiz'] },
  { n: 'Nimbus Interactive', adv: 18000, cut: 0.35, boost: 1.5,  rank: 3,  target: 25, fav: ['Adventure', 'Visual Novel', 'Rhythm', 'Escape Game'] },
  { n: 'Redwood Media',      adv: 35000, cut: 0.4,  boost: 1.75, rank: 6,  target: 28, fav: ['Sports', 'Racing', 'Fitness', 'Action'] },
  { n: 'Titan Arcade Group', adv: 80000, cut: 0.5,  boost: 2.2,  rank: 10, target: 31, fav: ['RPG', 'MMO', 'Strategy', 'Action'] }
];
const PUB = Object.fromEntries(PUBLISHERS.map(p => [p.n, p]));
const BUDGETS = [
  { n: 'Lean',     cost: 1, q: 0.9,  hp: 0.85, desc: 'cheap and quick, lower quality' },
  { n: 'Standard', cost: 2, q: 1.0,  hp: 1.0,  desc: 'balanced cost and quality' },
  { n: 'Premium',  cost: 4, q: 1.12, hp: 1.15, desc: 'costly and slower, higher quality' }
];
const MONET = [
  { n: 'Paid upfront',     launch: 2.0, live: 0.35, dl: 0.7, rev: 0.3,  ret: 0,     fans: 1,   desc: 'big launch, small tail, critics approve' },
  { n: 'Free + cosmetics', launch: 1.0, live: 1.0,  dl: 1.0, rev: 0,    ret: 0.01,  fans: 1,   desc: 'fair and steady live income' },
  { n: 'Ad-supported',     launch: 0.5, live: 0.8,  dl: 1.4, rev: -0.4, ret: -0.01, fans: 1,   desc: 'more downloads, critics grumble' },
  { n: 'Loot boxes',       launch: 1.0, live: 1.8,  dl: 1.0, rev: -1.2, ret: -0.02, fans: 0.5, desc: 'huge live income, critics and fans hate it' }
];
const CARDS = [
  { n: 'Deep Progression',      d: 'Retention +20%, more bugs',                  cost: 0,    f: d => { d.mods.statMul[2] *= 1.2; d.mods.bugMul *= 1.3; } },
  { n: 'Signature Art Style',   d: 'Impact +20%',                                cost: 2500, f: d => { d.mods.statMul[1] *= 1.2; } },
  { n: 'Tight Core Loop',       d: 'Play +20%, phases 15% longer',               cost: 0,    f: d => { d.mods.statMul[0] *= 1.2; d.mods.hpMul *= 1.15; } },
  { n: 'Social Sharing',        d: 'Craze +15%, +10 hype',                       cost: 1500, f: d => { d.mods.statMul[3] *= 1.15; d.hype += 10; } },
  { n: 'Scope Cut',             d: 'Phases 25% shorter, all stats -5%',          cost: 0,    f: d => { d.mods.hpMul *= 0.75; d.mods.statMul = d.mods.statMul.map(v => v * 0.95); } },
  { n: 'Accessibility Options', d: '+0.4 on every review',                       cost: 2000, f: d => { d.reviewBonus += 0.4; } },

function makeStaff(name, role, s, spd, hair) {
  const salary = Math.round((300 + s.reduce((a, b) => a + b, 0) * 2.5 + spd * 4) / 50) * 50;
  return { id: 0, name, role, lv: 1, exp: 0, s, spd, stam: 100, maxStam: 100, salary,
    hair: hair || pick(HAIR), cd: Math.random() * 30, rest: 0, anim: 0, flash: 0 };
}
function randomStaff(tier) {
  const role = pick(ROLE_NAMES), R = ROLES[role], base = [22, 34, 48][tier];
  const s = [0, 0, 0, 0].map(() => Math.round(base * 0.55 + rnd(0, 10)));
  s[R.main] += Math.round(base * 0.6 + rnd(0, 10));
  s[R.sub] += Math.round(base * 0.25 + rnd(0, 6));
  return makeStaff(pick(NAMES), role, s, Math.round(34 + tier * 5 + rnd(0, 8)));
}

function save() { try { if (STATE && !STATE.over) localStorage.setItem(SAVE_KEY, JSON.stringify(STATE)); } catch (e) {} }
function migrate(s) {
  if (!Array.isArray(s.licences) || s.v === 1) {
    s.licences = ['Feature Phone', 'Web Browser', 'Smartphone', 'PC'];
    ['Tablet', 'Cloud Console', 'VR Headset'].forEach(n => { const p = P[n]; if (s.rank >= p.rank && s.cal.y >= p.year) s.licences.push(n); });
  }
  s.pubRep = Object.assign(Object.fromEntries(PUBLISHERS.map(p => [p.n, 50])), s.pubRep || {});
  s.live.forEach(g => { if (g.cut === undefined) g.cut = 0; if (!g.liveMul) g.liveMul = 1; });
  if (s.hypeBank === undefined) s.hypeBank = 0;

function load() {

}

   ========================================================= */
function spend(n) {
  if (STATE.gold < n) { playSound('error'); news('Not enough money!', '#ef476f'); return false; }
  STATE.gold -= n; STATE.ledger.exp += n; updateHeader(); return true;
}
function earn(n) { STATE.gold += n; STATE.ledger.inc += n; STATE.totalRevenue += n; }
function rankNeed() { return 40 + STATE.rank * 30; }
function addRankExp(n) {
  STATE.rankExp += n;
  while (STATE.rankExp >= rankNeed()) {
    STATE.rankExp -= rankNeed(); STATE.rank++;
    playSound('level'); news(`Studio reached Rank ${STATE.rank}!`, '#ffd166');
    PLATFORMS.forEach(p => { if (p.rank === STATE.rank && platLive(p)) news(`Licence now available: ${p.n}`, '#66fcf1'); });
    PUBLISHERS.forEach(pb => { if (pb.adv && pb.rank === STATE.rank) news(`${pb.n} will now take your calls`, '#66fcf1'); });
  }
}
function targetSkill(rank) { return 50 + 4 * (rank - 1); }
function lvlOf(kind, n) { return Math.min(10, STATE.levels[kind][n] || 0); }
function yearFrac() { return STATE.cal.y + (STATE.cal.m - 1) / 12; }
function platLive(p) { const t = yearFrac(); return t >= p.year && !(p.end && t >= p.end); }
function marketNow(p) {
  if (!platLive(p)) return 0;
  const t = yearFrac();
  let f = Math.min(1, 0.45 + 0.55 * (t - p.year) / 2);
  if (p.decline && t > p.decline) f *= Math.max(0.15, 1 - 0.85 * (t - p.decline) / (p.end - p.decline));
  return p.peak * f;
}
function licensed(p) { return STATE.licences.includes(p.n); }
function platformOpen(p) { return platLive(p) && licensed(p) && STATE.rank >= p.rank; }
function pubRep(pb) { const r = STATE.pubRep[pb.n]; return r === undefined ? 50 : r; }
function pubAvailable(pb) { return !pb.adv || (STATE.rank >= pb.rank && pubRep(pb) >= 25); }
function pubAdvance(pb, genre) {
  if (!pb.adv) return 0;
  let a = pb.adv * (0.6 + pubRep(pb) / 100) * (pb.fav.includes(genre) ? 1.2 : 1);
  if (STATE.pubBonus === pb.n) a *= 1.5;
  return Math.round(a / 500) * 500;
}
function rankK() { return 1 + 0.25 * (STATE.rank - 1); }
function devCost(genre, b) { return Math.round((G[genre].cost + 1000 * rankK()) * BUDGETS[b].cost / 100) * 100; }
function weeklyRev(g) {
  return Math.round(g.users * g.arpu * 0.1 * (g.event > 0 ? 1.3 : 1) * (g.liveMul || 1) * (g.saleWeeks > 0 ? g.saleMul : 1) * (1 - (g.cut || 0)));
}
function normDev(d) {
  if (!d || d.kind !== 'game') return d;
  if (!d.mods) d.mods = {};
  if (!d.mods.statMul) d.mods.statMul = [1, 1, 1, 1];
  ['bugMul', 'speedMul', 'drainMul', 'hpMul'].forEach(k => { if (d.mods[k] === undefined) d.mods[k] = 1; });
  const defs = { budget: 1, focus: -1, monet: 1, pub: 'Self-publish', adv: 0, hype: 0, reviewBonus: 0, lead: 0, polished: false, eventsFired: 0, awaiting: false };
  for (const k in defs) if (d[k] === undefined) d[k] = defs[k];
  if (!d.decisions) d.decisions = [];
  return d;
}
function deskCount() { return FLOORS[STATE.floor - 1].desks; }
function liveSlots() { return FLOORS[STATE.floor - 1].live; }
function monthlyCost() {
  let c = STATE.team.reduce((a, m) => a + m.salary, 0) + FLOORS[STATE.floor - 1].rent;
  for (const k in FACILITIES) if (STATE.facilities[k]) c += FACILITIES[k].upkeep;
  return c;
}
function news(msg, color) { ticker.push({ msg, color: color || '#fff', life: 170 }); if (ticker.length > 6) ticker.shift(); }

/* =========================================================
   DEVELOPMENT
   ========================================================= */
function staminaDrain(d) {
  if (d.kind === 'contract') return 1.5;
  if (d.genre === 'Card Game' && d.platform === 'PC') return 0;
  return 2 * P[d.platform].drain * (G[d.genre].drain || 1) * ((d.mods && d.mods.drainMul) || 1);
}
function phaseHp(d, phase) {
  const base = [160, 220, 320][phase - 1];
  const bud = BUDGETS[d.budget === undefined ? 1 : d.budget];
  return Math.round(base * 1.15 * P[d.platform].hp * bud.hp * ((d.mods && d.mods.hpMul) || 1) * (1 + 0.08 * (d.rank - 1)));
}
function setupPhase(d) {
  const b = d.balloon;
  const names = ['Phase 1: Concept', 'Phase 2: Alpha', 'Phase 3: Beta', 'Phase 4: Debug', 'Phase 5: Polish'];
  const colors = ['#4cc9f0', '#9d4edd', '#ef476f', '#06d6a0', '#ffd166'];
  d.phaseName = names[d.phase - 1];
  b.color = colors[d.phase - 1];
  b.maxHp = d.phase === 4 ? 30 + d.bugs * 14 : d.phase === 5 ? Math.round(phaseHp(d, 3) * 0.4) : phaseHp(d, d.phase);
  b.hp = b.maxHp;
  $('btn-boost').disabled = !(d.phase === 3 && !d.boostUsed);
}

function startDevelopment() {
  if (STATE.activeDev) return;
  const genre = $('sel-genre').value, theme = $('sel-theme').value, platform = $('sel-platform').value;
  if (!genre || !theme || !P[platform]) { news('Pick a platform you hold a licence for (Market tab).', '#ef476f'); return; }
  const plat = P[platform];
  if (!platformOpen(plat)) { playSound('error'); news('Get a licence for that platform in Market first.', '#ef476f'); return; }
  if (!STATE.team.length) { news('Hire some staff first!', '#ef476f'); return; }
  const budget = +$('sel-budget').value || 0, focus = +$('sel-focus').value, monet = +$('sel-monet').value || 0;
  const pb = PUB[$('sel-pub').value] || PUBLISHERS[0];
  if (!pubAvailable(pb)) { playSound('error'); return; }
  const cost = plat.fee + devCost(genre, budget);
  if (!spend(cost)) return;
  const adv = pubAdvance(pb, genre);
  if (adv) {
    earn(adv); news(`${pb.n} paid a ${money(adv)} advance`, '#ffd166');
    if (STATE.pubBonus === pb.n) STATE.pubBonus = null;
  }
  const base = ($('inp-title').value || '').trim() || `${theme} ${genre}`;
  const n = STATE.history.filter(h => h.title === base || h.title.startsWith(base + ' ')).length;
  const title = n ? `${base} ${n + 1}` : base;
  const mult = (1 + 0.03 * lvlOf('g', genre)) * (1 + 0.03 * lvlOf('t', theme)) * BUDGETS[budget].q;
  const d = normDev({
    kind: 'game', id: STATE.nextDevId++, title, genre, theme, platform, rank: STATE.rank,
    phase: 1, phaseName: '', mult, bugs: 0, hits: 0, gainSum: 0, boostUsed: false,
    stats: [0, 0, 0, 0], budget, focus: isNaN(focus) ? -1 : focus, monet, pub: pb.n, adv, hype: STATE.hypeBank,
    balloon: { x: 160, y: 146, r: 20, hp: 1, maxHp: 1, color: '#4cc9f0' }
  });
  STATE.hypeBank = 0;
  d.decisions.push(`${BUDGETS[budget].n} budget`, d.focus < 0 ? 'Balanced focus' : `${STATS[d.focus]} focus`, MONET[monet].n);
  if (pb.adv) d.decisions.push(`Signed with ${pb.n}`);
  STATE.activeDev = d;
  setupPhase(d);
  $('inp-title').value = '';
  playSound('click');
  news(`Production started: ${title}`, '#66fcf1');
  renderDevMode();
  leadModal(d);
}

function doHit(m) {
  const d = STATE.activeDev;
  if (!d) return;
  const b = d.balloon, R = ROLES[m.role];
  const isLead = d.lead === m.id;
  const r = Math.random();
  const idx = r < 0.55 ? R.main : r < 0.8 ? R.sub : Math.floor(Math.random() * 4);
  const skill = m.s[idx];
  const crit = Math.random() < 0.06 + m.lv * 0.004;
  let dmg = (5 + m.lv * 0.6 + skill / 25) * (crit ? 1.5 : 1);
  let label;
  if (d.kind === 'game') {
    const focusMul = d.focus < 0 ? 1 : (idx === d.focus ? 1.25 : 0.92);
    const leadMul = isLead && idx === R.main ? 1.3 : 1;
    const polishMul = d.phase === 5 ? 1.25 : 1;
    const gain = skill / 12 * G[d.genre].w[idx] * d.mult * d.mods.statMul[idx] * focusMul * leadMul * polishMul * rnd(0.85, 1.15) * (crit ? 2 : 1);
    d.stats[idx] += gain; d.gainSum += gain; d.hits++;
    if ((d.phase === 2 || d.phase === 3) && Math.random() < (0.08 - Math.min(0.05, m.s[0] / 1500)) * d.mods.bugMul) d.bugs++;
    label = '+' + Math.max(1, Math.round(gain));
  } else {
    label = '+' + Math.round(dmg);
  }
  projectiles.push({ x: m.x, y: m.y - 14, tx: b.x + rnd(-8, 8), ty: b.y + rnd(-8, 8), color: STAT_COLORS[idx],
    dmg: Math.round(dmg), label: crit ? label + '!' : label, crit, devId: d.id, t: 0 });
  m.anim = 8;
  m.stam -= staminaDrain(d) * (isLead ? 1.25 : 1);
  if (m.stam <= 0) { m.stam = 0; m.rest = 90; }
  m.exp += 1;
  if (m.exp >= 20 + m.lv * 15) levelUp(m);
}

function levelUp(m) {
  m.exp = 0; m.lv++;
  m.s = m.s.map(v => v + ri(1, 2));
  m.s[ROLES[m.role].main] += 3;
  m.spd += 1; m.maxStam += 4; m.salary += 50; m.flash = 50;
  playSound('level');

}
function onImpact(p) {

}
function checkPhase() {
  const d = STATE.activeDev;

function completeProject() {
  const d = normDev(STATE.activeDev);
  STATE.activeDev = null; projectiles = [];
  const plat = P[d.platform], pb = PUB[d.pub] || PUBLISHERS[0], mo = MONET[d.monet] || MONET[1], w = G[d.genre].w;
  const q = d.hits ? (d.gainSum / d.hits) / (targetSkill(d.rank) / 12) : 0.5;
  const combo = compat(d.genre, d.theme);
  const key = d.genre + '|' + d.theme;
  const newCombo = !(key in STATE.combos);
  STATE.combos[key] = combo;
  const trend = STATE.trend && (STATE.trend.n === d.genre || STATE.trend.n === d.theme);
  const fit = plat.fav.includes(d.genre);
  const top = w.indexOf(Math.max(...w)), low = w.indexOf(Math.min(...w));
  const focusAdj = d.focus < 0 ? 0 : d.focus === top ? 0.4 : d.focus === low ? -0.3 : 0;
  const repeats = STATE.history.slice(0, 3).filter(h => h.genre === d.genre && h.theme === d.theme).length;
  const base = 4.5 * q - 1.1 + COMBO_REVIEW[combo] + (trend ? 0.5 : 0) + (fit ? 0.4 : 0) + mo.rev + d.reviewBonus + focusAdj - repeats * 0.8;
  const scores = REVIEWERS.map(() => clamp(Math.round(base + rnd(-1.1, 1.1)), 1, 10));
  const total = scores.reduce((a, b) => a + b, 0);
  const hof = total >= 32;

  const hypeMul = 1 + Math.min(d.hype, 100) / 100;
  const mkt = Math.max(0.2, marketNow(plat));
  const dl = Math.round((300 + 8 * Math.pow(STATE.fans, 0.75)) * Math.pow(total / 20, 2) * mkt * COMBO_DL[combo] *
    (trend ? 1.3 : 1) * (fit ? 1.2 : 1) * pb.boost * mo.dl * hypeMul * rnd(0.85, 1.15));
  const gross = Math.round(dl * plat.arpu * 1.5 * mo.launch);
  const pubTake = Math.round(gross * pb.cut);
  const rev = gross - pubTake;
  const fansGain = Math.round(dl * (hof ? 0.1 : 0.05) * mo.fans);
  const rpGain = 2 + Math.round(total / 6);
  earn(rev);
  STATE.fans += fansGain; STATE.rp += rpGain; STATE.totalDownloads += dl;
  addRankExp(10 + total + (d.genre === 'Adventure' ? 10 : 0));
  STATE.levels.g[d.genre] = (STATE.levels.g[d.genre] || 0) + 1;
  STATE.levels.t[d.theme] = (STATE.levels.t[d.theme] || 0) + 1;
  if (hof) earn(10000);

  let pubLine = '';
  if (pb.adv) {
    if (total >= pb.target) {
      STATE.pubRep[pb.n] = Math.min(100, pubRep(pb) + (hof ? 15 : 10));
      pubLine = `${pb.n} is delighted (target ${pb.target}+). Relationship up.`;
    } else if (total < pb.target - 5) {
      const claw = Math.round(d.adv * 0.3);
      STATE.gold -= claw; STATE.ledger.exp += claw;
      STATE.pubRep[pb.n] = Math.max(0, pubRep(pb) - 15);
      pubLine = `<span class="bad">${pb.n} expected ${pb.target}+ and clawed back ${money(claw)} of the advance.</span>`;
    } else {
      STATE.pubRep[pb.n] = Math.max(0, pubRep(pb) - 5);
      pubLine = `${pb.n} hoped for ${pb.target}+. Relationship slightly down.`;
    }
  }

  const entry = { title: d.title, genre: d.genre, theme: d.theme, platform: d.platform, total, dl, y: STATE.cal.y, t: STATE.cal.y * 12 + STATE.cal.m, pub: pb.n };
  STATE.history.unshift(entry);
  if (STATE.history.length > 40) STATE.history.length = 40;
  if (!STATE.yearBest || total > STATE.yearBest.total) STATE.yearBest = entry;

  // Live service
  const statSum = d.stats.reduce((a, b) => a + b, 0) || 1;
  const retShare = d.stats[2] / (statSum / 4);
  const ret = clamp(0.84 + 0.05 * (retShare - 1) + 0.1 * (total / 40) + mo.ret, 0.78, 0.975);
  const game = { id: d.id, title: d.title, platform: d.platform, users: dl, peak: dl, arpu: plat.arpu, ret, score: total, weeks: 0, event: 0,
    revTotal: rev, updates: 0, cut: pb.cut, liveMul: mo.live, monet: d.monet, saleWeeks: 0, saleMul: 1 };
  let liveNote = '';
  if (STATE.live.length < liveSlots()) { STATE.live.push(game); liveNote = 'Live service launched.'; }
  else {
    let wi = 0; STATE.live.forEach((g, i) => { if (g.users < STATE.live[wi].users) wi = i; });
    if (STATE.live[wi].users < dl) { liveNote = `Live slots full: replaced ${esc(STATE.live[wi].title)}.`; STATE.live[wi] = game; }
    else liveNote = 'Live slots full: this title was not added to Live Ops.';
  }

  const starN = Math.max(1, Math.round(total / 8));
  const stars = '★'.repeat(starN) + '☆'.repeat(5 - starN);
  const revRows = scores.map((s, i) => `<div class="rev"><span>${REVIEWERS[i]}: “${QUOTES[s]}”</span><b>${s}</b></div>`).join('');
  const html = `
    <h3>${esc(d.title)}</h3>
    <div class="muted" style="text-align:center;">${esc(d.genre)} × ${esc(d.theme)} · ${esc(d.platform)}</div>
    <div style="text-align:center;">Combo: <b style="color:${COMBO_COLOR[combo]}">${COMBO_LABEL[combo]}</b>${newCombo ? ' <span class="gold">(new!)</span>' : ''}${trend ? ' · <span class="good">Trending!</span>' : ''}${fit ? ' · <span class="good">Platform favourite</span>' : ''}</div>
    ${repeats ? `<div class="note bad">Critics feel it's a rerun of your recent work (-${(repeats * 0.8).toFixed(1)} per review). Mix up your combos!</div>` : ''}
    ${mo.rev < 0 ? `<div class="note bad mini">Critics marked it down for its ${esc(mo.n.toLowerCase())} model.</div>` : ''}
    ${revRows}
    <div class="big">${total} / 40</div>
    <div style="text-align:center; color:var(--gold);">${stars}</div>
    ${hof ? '<div style="text-align:center;" class="gold">🏆 HALL OF FAME! +$10,000</div>' : ''}
    <div class="note">Downloads: <b>${fmt(dl)}</b>${d.hype ? ` (hype ${Math.round(d.hype)})` : ''}<br>Launch revenue: <b class="gold">${money(rev)}</b>${pubTake ? ` after ${esc(pb.n)}'s ${Math.round(pb.cut * 100)}% cut` : ''}<br>New fans: +${fmt(fansGain)} · Research: +${rpGain} RP<br>${liveNote}${pubLine ? '<br>' + pubLine : ''}</div>
    <div class="note mini muted">Decisions: ${d.decisions.map(esc).join(' · ')}</div>`;
  playSound(hof ? 'fanfare' : 'coin');
  showModal(html, [{ label: 'Release! 🚀', cls: 'btn-accent' }]);
  renderDevMode(); renderAll(); save();
}

function advanceWeek() {
  const c = STATE.cal;
  // live service revenue
  for (const g of STATE.live) {
    const weekly = weeklyRev(g);
    earn(weekly); g.revTotal += weekly;
    const p = P[g.platform];
    const ret = g.ret + (STATE.facilities.servers ? 0.012 : 0) - (p && !platLive(p) ? 0.08 : 0);
    const growth = 0.07 * (g.score / 40) * Math.max(0, 1 - g.weeks / 16) + (g.event > 0 ? 0.03 : 0);
    g.users = Math.round(g.users * Math.min(1.03, ret + growth));
    if (g.monet === 3 && Math.random() < 0.03) { g.users = Math.round(g.users * 0.85); news(`Players revolt over loot boxes in ${g.title}!`, '#ef476f'); }
    g.peak = Math.max(g.peak, g.users);
    STATE.fans += Math.round(Math.min(g.users * 0.0005, 50 * STATE.rank));
    g.weeks++; if (g.event > 0) g.event--; if (g.saleWeeks > 0) g.saleWeeks--;
  }
  const ended = STATE.live.filter(g => g.users < 50);
  ended.forEach(g => news(`${g.title} ended its service.`, '#9aa5b1'));
  STATE.live = STATE.live.filter(g => g.users >= 50);

  // random happenings
  if (Math.random() < 0.08) randomEvent();

  c.w++;
  if (c.w > 4) {
    c.w = 1; c.m++;
    let newYear = false;
    if (c.m > 12) { c.m = 1; c.y++; newYear = true; }
    monthEnd();
    if (newYear && !STATE.over) yearEnd();
    if (!STATE.over) monthEvents();
  }
  updateHeader();
  renderActiveTab();
}

function randomEvent() {
  const r = Math.random();
  if (r < 0.35 && STATE.live.length) {
    const g = pick(STATE.live); g.users = Math.round(g.users * 1.25);
    news(`A big streamer played ${g.title}! Players up 25%`, '#06d6a0');
  } else if (r < 0.6) {
    const m = pick(STATE.team); if (!m) return; STATE.rp += 2;
    news(`${m.name} had a eureka moment! +2 RP`, '#66fcf1');
  } else if (r < 0.8 && STATE.live.length && !STATE.facilities.servers) {
    const g = pick(STATE.live); g.users = Math.round(g.users * 0.9);
    news(`Server outage hit ${g.title}. Players down 10%`, '#ef476f');
  } else {
    const n = 500 * STATE.rank; earn(n);
    news(`A sponsor sent a gift: +${money(n)}`, '#ffd166');
  }
}
function monthEnd() {
  const cost = monthlyCost();
  STATE.gold -= cost; STATE.ledger.exp += cost;
  STATE.ledger.lastInc = STATE.ledger.inc; STATE.ledger.lastExp = STATE.ledger.exp;
  STATE.ledger.inc = 0; STATE.ledger.exp = 0;
  news(`Payday: -${money(cost)} (salaries, rent, upkeep)`, '#ef476f');
  // new trend
  const pool = STATE.unlocked.g.map(n => ({ type: 'genre', n })).concat(STATE.unlocked.t.map(n => ({ type: 'theme', n })));
  STATE.trend = pick(pool);
  news(`Trend this month: ${STATE.trend.n}!`, '#ffd166');

  PLATFORMS.forEach(p => {
    if (STATE.cal.m === 1 && p.year === STATE.cal.y) news(`New platform launched: ${p.n}! Licences in Market.`, '#66fcf1');
    if (STATE.cal.m === 1 && p.end === STATE.cal.y) news(`${p.n} has been discontinued.`, '#9aa5b1');

  const nextM = STATE.cal.m % 12 + 1;

function yearEnd() {

function attendCon(b) {

  showModal(`<h3>GameCon Results</h3><div class="big" style="font-size:1.1rem;">Booth ranked #${place} of 40</div><div class="note">+${fmt(fans)} fans · +${b.hype} hype ${forGame ? 'for ' + esc(d.title) : 'banked for your next project'}${pubLine}</div>`);

}
function showcase() {
  const now = STATE.cal.y * 12 + STATE.cal.m;
  const elig = STATE.history.filter(h => (h.t ? now - h.t <= 12 : h.y >= STATE.cal.y - 1)).sort((a, b) => b.total - a.total)[0];
  if (!elig) { news('Indie Showcase: nothing recent to enter.', '#9aa5b1'); return; }
  showModal(`<h3>🎖 Indie Showcase</h3><div class="note">Judges are taking entries for this year's showcase. Your best recent release is <b>${esc(elig.title)}</b> (${elig.total}/40). Entry fee $1,000. The judges' scoring can swing a few points either way.</div>`,
    [{ label: `Enter ${elig.title}`, cls: 'btn-accent', disabled: STATE.gold < 1000, action: () => enterShowcase(elig) }, { label: 'Skip' }]);

function enterShowcase(h) {
  if (!spend(1000)) return;
  const j = h.total + rnd(-4, 4);
  let res;
  if (j >= 31) { earn(20000); STATE.fans += 800; addRankExp(15); res = '🏆 Grand Prize! +$20,000 and +800 fans'; playSound('fanfare'); }
  else if (j >= 24) { earn(5000); STATE.fans += 300; res = 'Honourable mention: +$5,000 and +300 fans'; playSound('coin'); }
  else res = 'No award this time. The judges wanted more polish.';

}
function holidaySale() {
  if (!STATE.live.length) return;
  showModal(`<h3>🎁 Holiday Sale</h3><div class="note">Storefronts are running their year-end sale. Discounting your live games brings a wave of new players, but each one spends less for the next 4 weeks.</div>`,
    [{ label: '50% off: +35% players', action: () => runSale(1.35, 0.65) },
     { label: '25% off: +15% players', action: () => runSale(1.15, 0.85) },

}
function runSale(u, r) {
  STATE.live.forEach(g => { g.users = Math.round(g.users * u); g.peak = Math.max(g.peak, g.users); g.saleWeeks = 4; g.saleMul = r; });
  playSound('coin'); news('Holiday sale is live!', '#06d6a0'); renderLive();
}

  const p = P[n];

/* =========================================================
   LIVE OPS ACTIONS
   ========================================================= */
function findLive(id) { return STATE.live.find(g => g.id === id); }
function liveEvent(id) {
  const g = findLive(id); if (!g || g.event > 0) return;
  const cost = Math.round(2000 + g.users * 0.3);
  if (!spend(cost)) return;
  g.event = 4; playSound('coin'); news(`Event started in ${g.title}!`, '#06d6a0'); renderLive();
}
function liveUpdate(id) {
  const g = findLive(id); if (!g) return;
  const cost = 3000 + g.updates * 1500;
  if (g.ret >= 0.985) { news('This game is already as sticky as it gets.', '#9aa5b1'); return; }
  if (!spend(cost)) return;
  g.ret = Math.min(0.985, g.ret + 0.012); g.updates++;
  g.users = Math.round(g.users * 1.05);
  playSound('coin'); news(`${g.title} content update shipped!`, '#66fcf1'); renderLive();
}
function liveAds(id) {
  const g = findLive(id); if (!g) return;
  const cost = 5000 * (1 + 0.2 * (STATE.rank - 1));
  if (!spend(Math.round(cost))) return;
  const add = Math.round((STATE.fans * 0.6 + 300) * Math.max(0.3, marketNow(P[g.platform])));
  g.users += add; g.peak = Math.max(g.peak, g.users);
  playSound('coin'); news(`Ad campaign: +${fmt(add)} players`, '#06d6a0'); renderLive();
}
function retireLive(id) {
  const g = findLive(id); if (!g) return;
  showModal(`<h3>End Service?</h3><div class="note">Shut down ${esc(g.title)} and free its slot? Its ${fmt(g.users)} players will move on.</div>`,
    [{ label: 'Shut Down', cls: 'btn-danger', action: () => { STATE.live = STATE.live.filter(x => x.id !== id); renderLive(); save(); } }, { label: 'Keep Running' }]);
}

/* =========================================================
   STAFF ACTIONS
   ========================================================= */
function findStaff(id) { return STATE.team.find(m => m.id === id); }
function trainCost(m, k) { return Math.round((k === 4 ? 2500 : 1500) * (1 + 0.15 * (m.lv - 1)) / 50) * 50; }
function openTraining(id) {
  const m = findStaff(id); if (!m) return;
  const opts = [['Coding Bootcamp', 'Play +5'], ['Art Class', 'Impact +5'], ['Community Seminar', 'Retention +5'], ['Brainstorm Retreat', 'Craze +5'], ['Speed Drills', 'Speed +3']];
  const rows = opts.map((o, k) => `<div class="row card" style="flex-direction:row;"><span><b>${o[0]}</b><br><span class="muted">${o[1]} · -20 stamina</span></span>
    <button class="btn-sm btn-accent" onclick="doTrain(${id},${k})">${money(trainCost(m, k))}</button></div>`).join('');
  showModal(`<h3>Train ${esc(m.name)}</h3><div class="note">${m.role} · Lv${m.lv} · ${STATS.map((s, i) => s[0] + ':' + m.s[i]).join(' ')} · SPD:${m.spd}<br>Stamina ${Math.round(m.stam)}/${m.maxStam}</div>${rows}`, [{ label: 'Done' }]);
}
function doTrain(id, k) {
  const m = findStaff(id); if (!m) return;
  if (m.rest > 0 || m.stam < 20) { playSound('error'); news(`${m.name} is too tired to train.`, '#ef476f'); return; }
  if (!spend(trainCost(m, k))) return;
  if (k === 4) m.spd += 3; else { m.s[k] += 5; if (Math.random() < 0.5) m.s[ri(0, 3)] += 1; }
  m.stam -= 20; m.exp += 5;
  if (m.exp >= 20 + m.lv * 15) levelUp(m);
  playSound('level');
  openTraining(id); closeModal();
  renderStaff(); save();
}
function openRoleChange(id) {
  const m = findStaff(id); if (!m) return;
  const rows = ROLE_NAMES.filter(r => r !== m.role).map(r => `<button onclick="setRole(${id},'${r}')">${r} (main: ${STATS[ROLES[r].main]})</button>`).join('');
  showModal(`<h3>Change Role</h3><div class="note">${esc(m.name)} keeps all stats. Their main stat focus changes with the new role.</div><div style="display:flex;flex-direction:column;gap:6px;">${rows}</div>`, [{ label: 'Cancel' }]);
}
function setRole(id, r) {
  const m = findStaff(id); if (m && ROLES[r]) { m.role = r; playSound('level'); news(`${m.name} is now a ${r}.`, '#66fcf1'); }
  closeModal(); renderStaff(); save();
}
function fireStaff(id) {
  const m = findStaff(id); if (!m) return;
  if (STATE.team.length <= 1) { news('You need at least one staff member.', '#ef476f'); return; }
  showModal(`<h3>Let ${esc(m.name)} go?</h3><div class="note">Saves ${money(m.salary)} per month. This can't be undone.</div>`,
    [{ label: 'Dismiss', cls: 'btn-danger', action: () => { STATE.team = STATE.team.filter(x => x.id !== id); renderStaff(); save(); } }, { label: 'Cancel' }]);
}
function postAd(tier) {
  const cost = [0, 3000, 12000][tier];
  if (!spend(cost)) return;
  STATE.candidates = [randomStaff(tier), randomStaff(tier), randomStaff(Math.min(2, tier + (Math.random() < 0.2 ? 1 : 0)))];
  openCandidates();
}
function openCandidates() {
  const full = STATE.team.length >= deskCount();
  const rows = STATE.candidates.map((c, i) => `<div class="card">
      <div class="row"><b>${esc(c.name)} · ${c.role}</b><span class="muted">${money(c.salary)}/mo</span></div>
      <div class="muted">${STATS.map((s, j) => s + ' ' + c.s[j]).join(' · ')} · SPD ${c.spd}</div>
      <div class="row"><span class="gold">Signing fee ${money(c.salary * 2)}</span>
      <button class="btn-sm btn-accent" ${full ? 'disabled' : ''} onclick="hireCandidate(${i})">Hire</button></div></div>`).join('');
  showModal(`<h3>Applicants</h3>${full ? '<div class="note bad">All desks are full. Upgrade your floor or dismiss someone first.</div>' : ''}${rows || '<div class="note">No applicants left.</div>'}`, [{ label: 'Close' }]);
}
function hireCandidate(i) {
  const c = STATE.candidates[i];
  if (!c || STATE.team.length >= deskCount()) return;
  if (!spend(c.salary * 2)) return;
  c.id = STATE.nextId++;
  STATE.team.push(c);
  STATE.candidates.splice(i, 1);
  playSound('fanfare'); news(`${c.name} joined the studio!`, '#06d6a0');
  openCandidates(); closeModal(); renderStaff(); save();
}
function snackBundle() {
  if (!spend(1000)) return;
  STATE.team.forEach(m => { m.stam = Math.min(m.maxStam, m.stam + 50); if (m.rest) { m.rest = 0; m.stam = Math.max(m.stam, 40); } });
  playSound('coin'); news('Snacks delivered! Everyone perks up.', '#06d6a0'); renderStaff();
}
function teamRetreat() {
  const cost = 6000 + STATE.team.length * 800;
  if (!spend(cost)) return;
  STATE.team.forEach(m => { m.s = m.s.map(v => v + 2); m.stam = m.maxStam; m.rest = 0; });
  playSound('fanfare'); news('Team retreat: everyone +2 all stats!', '#ffd166'); renderStaff(); save();
}

function unlockItem(kind, n) {

  if (!item || STATE.unlocked[kind].includes(n)) return;
  if (STATE.rank < item.rank) { playSound('error'); return; }
  if (STATE.rp < item.rp) { playSound('error'); news('Not enough research points.', '#ef476f'); return; }
  STATE.rp -= item.rp; STATE.unlocked[kind].push(n);
  playSound('level'); news(`Unlocked ${kind === 'g' ? 'genre' : 'theme'}: ${n}`, '#ffd166');
  refreshDevOptions(); renderLab(); updateHeader(); save();
}
function upgradeFloor() {
  const next = FLOORS[STATE.floor];
  if (!next || STATE.rank < next.rank) { playSound('error'); return; }
  if (!spend(next.cost)) return;
  STATE.floor++;
  playSound('fanfare'); news(`Moved up to Floor ${STATE.floor}!`, '#ffd166');
  renderStudio(); save();
}
function buyFacility(k) {

function renderMarket() {
  const t = yearFrac();
  let html = `<div class="sec">Industry Calendar</div><div class="note">Month 4: Indie Showcase · Month 8: GameCon · Month 12: Holiday Sale · Year end: Awards${STATE.hypeBank ? `<br>Banked hype for your next project: <b class="gold">${STATE.hypeBank}</b>` : ''}${STATE.pubBonus ? `<br>🤝 Bonus advance waiting with ${esc(STATE.pubBonus)}` : ''}</div>`;
  html += '<div class="sec">Platforms</div>';
  PLATFORMS.forEach(p => {
    const live = platLive(p), up = t < p.year, gone = p.end && t >= p.end;
    if (gone) { html += `<div class="row muted mini" style="opacity:0.6;"><span>${p.n}</span><span>Discontinued</span></div>`; return; }
    if (up && p.year - t > 3) return;
    const mk = marketNow(p);
    const status = up ? `Launches Year ${p.year}` : (p.decline && t > p.decline ? '<span class="bad">Declining</span>' : t - p.year < 2 ? '<span class="good">Growing</span>' : 'Mature');
    let btn;
    if (licensed(p)) btn = '<span class="good">Licensed</span>';
    else if (up) btn = `<span class="muted">Rank ${p.rank}</span>`;
    else if (STATE.rank < p.rank) btn = `<span class="muted">🔒 Rank ${p.rank}</span>`;
    else btn = `<button class="btn-sm btn-accent" ${STATE.gold < p.lic ? 'disabled' : ''} onclick="buyLicence('${p.n}')">Licence ${p.lic ? money(p.lic) : 'free'}</button>`;
    html += `<div class="card"><div class="row"><b>${p.n}</b>${btn}</div>
      <div class="muted">${status} · ${money(p.fee)} fee per game · players spend ${money(p.arpu)}</div>
      <div class="statrow"><span>Market</span><div class="bar"><div style="background:var(--accent);width:${Math.min(100, mk / 3.5 * 100)}%"></div></div><span>${mk.toFixed(1)}</span></div>
      <div class="muted mini">Favours: ${p.fav.join(', ')}</div></div>`;
  });
  html += `<div class="sec">Publishers</div><div class="note mini">Publishers pay an advance up front and boost downloads, then take a cut of launch and live revenue. Miss their target score badly and they claw back part of the advance. Hit it and they offer more next time.</div>`;
  PUBLISHERS.filter(pb => pb.adv).forEach(pb => {
    const rep = pubRep(pb);
    const status = STATE.rank < pb.rank ? `<span class="muted">🔒 Rank ${pb.rank}</span>` : rep < 25 ? '<span class="bad">Not signing you</span>' : '<span class="good">Open</span>';
    html += `<div class="card"><div class="row"><b>${pb.n}</b>${status}</div>
      <div class="muted">Advance about ${money(pubAdvance(pb, ''))} · takes ${Math.round(pb.cut * 100)}% · downloads ×${pb.boost} · expects ${pb.target}+/40</div>
      <div class="statrow"><span>Relationship</span><div class="bar"><div style="background:${rep < 25 ? 'var(--danger)' : 'var(--gold)'};width:${rep}%"></div></div><span>${rep}</span></div>
      <div class="muted mini">Pays 20% more for: ${pb.fav.join(', ')}</div></div>`;
  });
  $('tab-market').innerHTML = html;
}

function renderLab() {
  const lockedG = GENRES.filter(g => !STATE.unlocked.g.includes(g.n));
  const lockedT = THEMES.filter(t => !STATE.unlocked.t.includes(t.n));
  const row = (kind, it) => {
    const rankOk = STATE.rank >= it.rank;
    return `<div class="row card" style="flex-direction:row;"><span>${esc(it.n)}<br><span class="muted">${rankOk ? it.rp + ' RP' : '🔒 Rank ' + it.rank}</span></span>
      <button class="btn-sm btn-accent" ${!rankOk || STATE.rp < it.rp ? 'disabled' : ''} onclick="unlockItem('${kind}','${it.n}')">Unlock</button></div>`;
  };
  const combos = Object.entries(STATE.combos).sort((a, b) => b[1] - a[1]);
  let html = `<div class="row"><span class="sec">Research Lab</span><span class="hl">${STATE.rp} RP</span></div>
    <div class="note">Earn research points from releases, contracts and staff ideas. Spend them to unlock new genres and themes.</div>
    <div class="sec">Genres</div>${lockedG.map(g => row('g', g)).join('') || '<div class="muted">All genres unlocked!</div>'}
    <div class="sec">Themes</div>${lockedT.map(t => row('t', t)).join('') || '<div class="muted">All themes unlocked!</div>'}
    <div class="sec">Combo Notebook (${combos.length})</div>`;
  html += combos.length
    ? combos.map(([k, v]) => `<div class="row" style="font-size:0.74rem;"><span>${esc(k.replace('|', ' × '))}</span><b style="color:${COMBO_COLOR[v]}">${COMBO_LABEL[v]}</b></div>`).join('')
    : '<div class="muted">Release games to discover combos.</div>';
  $('tab-lab').innerHTML = html;
}

function renderStudio() {
  const f = FLOORS[STATE.floor - 1], next = FLOORS[STATE.floor];
  const best = STATE.history.reduce((a, h) => Math.max(a, h.total), 0);
  let html = `<div class="sec">Finances</div>
    <div class="note">Last month: income <b class="good">${money(STATE.ledger.lastInc)}</b> · spending <b class="bad">${money(STATE.ledger.lastExp)}</b><br>
    This month so far: +${money(STATE.ledger.inc)} / -${money(STATE.ledger.exp)}<br>
    Next payday (end of month): <b class="bad">${money(monthlyCost())}</b></div>
    <div class="sec">Office · Floor ${STATE.floor}</div>
    <div class="note">${f.desks} desks · ${f.live} live slots · Rent ${money(f.rent)}/mo</div>`;
  html += next
    ? `<button ${STATE.rank < next.rank ? 'disabled' : ''} onclick="upgradeFloor()">Move to Floor ${STATE.floor + 1}: ${money(next.cost)} (Rank ${next.rank})<br><span class="muted">${next.desks} desks · ${next.live} live slots · rent ${money(next.rent)}</span></button>`
    : '<div class="muted">Top floor reached!</div>';
  html += '<div class="sec">Facilities</div>';
  for (const k in FACILITIES) {
    const fa = FACILITIES[k], own = STATE.facilities[k];
    html += `<div class="row card" style="flex-direction:row;"><span><b>${fa.n}</b><br><span class="muted">${fa.desc} Upkeep ${money(fa.upkeep)}/mo</span></span>
      ${own ? '<span class="good">Owned</span>' : `<button class="btn-sm btn-accent" onclick="buyFacility('${k}')">${money(fa.cost)}</button>`}</div>`;
  }
  html += `<div class="sec">Records</div>
    <div class="note">Games released: ${STATE.history.length} · Best score: ${best || '-'}/40<br>Lifetime downloads: ${fmt(STATE.totalDownloads)} / 1,000,000,000<br>Lifetime revenue: ${money(STATE.totalRevenue)}</div>`;
  html += STATE.history.slice(0, 10).map(h => `<div class="row" style="font-size:0.72rem;"><span>Y${h.y} ${esc(h.title)}</span><span>${h.total >= 32 ? '🏆' : ''}${h.total}/40 · ${fmt(h.dl)}</span></div>`).join('');
  html += `<div class="sec">Settings</div><div class="grid2">
    <button onclick="toggleSound()">Sound: ${STATE.settings.sound ? 'On' : 'Off'}</button>
    <button class="btn-danger" onclick="resetGame()">Reset Save</button></div>
    <div class="muted" style="font-size:0.68rem;">Progress autosaves every month and when you leave the app.</div>`;
  $('tab-studio').innerHTML = html;
}

/* =========================================================
   CANVAS RENDERING
   ========================================================= */
const canvas = $('screen');
const ctx = canvas.getContext('2d');
ctx.imageSmoothingEnabled = false;
function px(c, x, y, w, h) { ctx.fillStyle = c; ctx.fillRect(Math.round(x), Math.round(y), w, h); }
function txt(s, x, y, color, size, align) {
  ctx.font = `bold ${size || 8}px "Courier New", monospace`;
  ctx.textAlign = align || 'center';
  ctx.fillStyle = '#000'; ctx.fillText(s, x + 1, y + 1);
  ctx.fillStyle = color || '#fff'; ctx.fillText(s, x, y);
}
function deskPos(i) { return i < 5 ? { x: 36 + i * 62, y: 80 } : { x: 60 + (i - 5) * 67, y: 214 }; }

function drawOffice() {
  const fl = STATE.floor;
  const wall = ['#b08968', '#8ecae6', '#cdb4db'][fl - 1];
  const tiles = [['#6b5a60', '#5c4b51'], ['#3d5a80', '#46658f'], ['#6a4c93', '#7a5ca3']][fl - 1];
  px(wall, 0, 0, 320, 44);
  px('rgba(0,0,0,0.12)', 0, 30, 320, 14);
  [30, 118, 206].forEach(wx => {
    px('#3d405b', wx, 6, 46, 26);
    px(SKY[STATE.cal.m - 1], wx + 2, 8, 42, 22);
    px('#ffffff', wx + 8, 13, 10, 3); px('#ffffff', wx + 26, 19, 8, 2);
    px('#3d405b', wx + 22, 8, 2, 22);
  });
  // clock
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(292, 18, 9, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#3d405b'; ctx.lineWidth = 2; ctx.stroke();
  const ang = (STATE.tick / TPW) * Math.PI * 2 - Math.PI / 2;
  ctx.beginPath(); ctx.moveTo(292, 18); ctx.lineTo(292 + Math.cos(ang) * 6, 18 + Math.sin(ang) * 6); ctx.stroke();
  px('#22223b', 0, 42, 320, 4);
  for (let y = 46; y < 240; y += 16) for (let x = 0; x < 320; x += 16) px(tiles[((x + y) / 16) % 2], x, y, 16, 16);
  // plants
  [[6, 112], [300, 112]].forEach(([x, y]) => {
    px('#8d5524', x + 2, y + 10, 10, 10); px('#2d6a4f', x, y, 14, 10); px('#40916c', x + 3, y - 5, 8, 7);
  });
  // facilities
  if (STATE.facilities.coffee) { px('#495057', 300, 160, 14, 18); px('#e63946', 303, 164, 8, 4); px('#adb5bd', 304, 172, 6, 4); }
  if (STATE.facilities.servers) { for (let i = 0; i < 2; i++) { px('#212529', 4 + i * 8, 156, 7, 26); px(frameT % 30 < 15 ? '#06d6a0' : '#1b4332', 6 + i * 8, 160, 3, 2); } }
}

function drawStaff(m, x, y) {
  const R = ROLES[m.role];
  px('#3a3a4a', x - 8, y - 12, 16, 13);
  if (m.rest > 0) {
    px(R.color, x - 6, y - 4, 12, 8);
    px(m.hair, x - 5, y - 6, 10, 6);
  } else {
    px(R.color, x - 6, y - 8, 12, 10);
    px('#f1c27d', x - 5, y - 17, 10, 9);
    px(m.hair, x - 5, y - 19, 10, 3); px(m.hair, x - 5, y - 17, 2, 4); px(m.hair, x + 3, y - 17, 2, 4);
    const blink = (frameT + m.id * 37) % 120 < 4;
    px('#222', x - 3, y - 13, 2, blink ? 1 : 2); px('#222', x + 1, y - 13, 2, blink ? 1 : 2);
    if (m.anim > 0) px('#f1c27d', x + 6, y - 16, 3, 7);
  }
  px('#8d6e63', x - 13, y + 1, 26, 10); px('#6d4c41', x - 13, y + 9, 26, 2);
  px('#2b2d42', x - 5, y - 4, 10, 6); px('#555', x - 1, y + 1, 2, 1);
  if (m.rest > 0) txt('Zz', x + 10, y - 10 - (frameT % 40) / 8, '#ef476f', 8);
  else {
    px('#000', x - 8, y - 25, 16, 3);
    px(m.stam < 30 ? '#ef476f' : '#06d6a0', x - 8, y - 25, Math.max(0, m.stam / m.maxStam * 16), 3);
  }
  if (m.flash > 0) txt('LV UP', x, y - 30 - (50 - m.flash) / 5, '#ffd166', 8);
}

function drawBalloon(d) {
  const b = d.balloon, by = b.y + Math.sin(frameT / 18) * 2;
  px('#dddddd', b.x, by + b.r, 1, 12);
  ctx.fillStyle = 'rgba(0,0,0,0.25)'; ctx.beginPath(); ctx.ellipse(b.x, 196, b.r * 0.8, 4, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = b.color; ctx.beginPath(); ctx.arc(b.x, by, b.r, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,0.35)'; ctx.lineWidth = 2; ctx.stroke();
  px('rgba(255,255,255,0.6)', b.x - b.r * 0.55, by - b.r * 0.6, 5, 5);
  px('#fff', b.x - 6, by - 4, 4, 5); px('#fff', b.x + 2, by - 4, 4, 5);
  px('#000', b.x - 5, by - 2, 2, 3); px('#000', b.x + 3, by - 2, 2, 3);
  if (b.hp / b.maxHp < 0.3) px('#90e0ef', b.x + b.r - 6, by - 8, 3, 5);
  px(b.color, b.x - 2, by + b.r - 1, 4, 3);
  px('#111', b.x - 26, by - b.r - 12, 52, 6);
  px('#ffd166', b.x - 25, by - b.r - 11, Math.max(0, b.hp / b.maxHp) * 50, 4);
  txt(d.phaseName, b.x, by - b.r - 16, '#fff', 9);
  if (d.kind === 'game' && d.phase >= 2) {
    const n = d.phase === 4 ? Math.ceil(b.hp / 14) : Math.min(8, d.bugs);
    for (let i = 0; i < Math.min(8, n); i++) {
      const a = frameT / 30 + i * (Math.PI * 2 / Math.max(1, Math.min(8, n)));
      const bx = b.x + Math.cos(a) * (b.r + 10), byy = by + Math.sin(a) * (b.r + 6);
      px('#2b2d42', bx - 2, byy - 2, 5, 4); px('#ef476f', bx - 1, byy - 1, 3, 2);
    }
  }
}

function render() {
  frameT++;
  drawOffice();
  const desks = deskCount(), dv = STATE.activeDev;
  for (let i = 0; i < desks; i++) {
    const p = deskPos(i), m = STATE.team[i];
    if (m) {
      m.x = p.x; m.y = p.y; drawStaff(m, p.x, p.y);
      if (dv && dv.lead === m.id && m.rest <= 0) { px('#ffd166', p.x - 4, p.y - 30, 9, 3); px('#ffd166', p.x - 4, p.y - 33, 2, 3); px('#ffd166', p.x - 1, p.y - 34, 3, 4); px('#ffd166', p.x + 3, p.y - 33, 2, 3); }
    }
    else { px('#8d6e63', p.x - 13, p.y + 1, 26, 10); px('#6d4c41', p.x - 13, p.y + 9, 26, 2); txt('vacant', p.x, p.y - 4, 'rgba(255,255,255,0.5)', 7); }
  }
  const d = STATE.activeDev;
  if (d) drawBalloon(d);
  else txt('~ Studio Idle ~', 160, 150, '#66fcf1', 10);
  projectiles.forEach(p => { px(p.color, p.x - 2, p.y - 2, 5, 5); px('#fff', p.x - 1, p.y - 1, 2, 2); });
  particles.forEach(p => txt(p.text, p.x, p.y, p.color, 9));
  if (ticker.length) {
    const t = ticker[0];
    px('rgba(0,0,0,0.75)', 0, 0, 320, 14);
    txt(t.msg.length > 52 ? t.msg.slice(0, 51) + '…' : t.msg, 160, 10, t.color, 8);
  }
  if (STATE.speed === 0 && !modalOpen) { px('rgba(0,0,0,0.45)', 110, 226, 100, 14); txt('PAUSED', 160, 236, '#ffd166', 9); }
}

/* =========================================================
   SIMULATION LOOP (fixed timestep, frame-rate independent)
   ========================================================= */
function update() {
  simTick++;
  STATE.tick++;
  if (STATE.tick >= TPW) { STATE.tick = 0; advanceWeek(); if (modalOpen) return; }
  const d = STATE.activeDev;
  const regen = STATE.facilities.coffee ? 1.6 : 1;
  STATE.team.forEach((m, i) => { const p = deskPos(i); m.x = p.x; m.y = p.y; });
  for (const m of STATE.team) {
    if (m.anim > 0) m.anim--;
    if (m.flash > 0) m.flash--;
    if (m.rest > 0) { m.rest--; m.stam = Math.min(m.maxStam, m.stam + 0.7 * regen); continue; }
    if (d && !d.awaiting) {
      m.stam = Math.min(m.maxStam, m.stam + 0.02 * regen);
      m.cd += (m.spd / 30) * (STATE.facilities.pcs ? 1.1 : 1) * (d.mods ? d.mods.speedMul : 1) * (d.lead === m.id ? 1.15 : 1);
      if (m.cd >= 55) { m.cd = 0; doHit(m); }
    } else {
      m.stam = Math.min(m.maxStam, m.stam + 0.35 * regen);
    }
  }
  if (d && d.kind === 'game' && !d.awaiting && d.phase <= 3 && d.eventsFired < 2 && Math.random() < 1 / (TPS * 30)) devEvent(d);
  for (const p of projectiles) {
    p.x += (p.tx - p.x) * 0.22; p.y += (p.ty - p.y) * 0.22; p.t++;
    if (!p.done && (Math.hypot(p.tx - p.x, p.ty - p.y) < 4 || p.t > 40)) { p.done = true; onImpact(p); }
  }
  projectiles = projectiles.filter(p => !p.done);
  particles.forEach(p => { p.y += p.vy; p.life--; });
  particles = particles.filter(p => p.life > 0);
  if (ticker.length) { ticker[0].life--; if (ticker[0].life <= 0) ticker.shift(); }
  if (simTick % 6 === 0) { updateDevPanel(); updateHeader(); }
}
function frame(now) {
  const dt = Math.min(250, now - lastT); lastT = now;
  if (!modalOpen && STATE.speed > 0 && !STATE.over) {
    acc += dt * STATE.speed;
    const step = 1000 / TPS;
    let guard = 0;
    while (acc >= step && guard++ < 40) { update(); acc -= step; if (modalOpen) { acc = 0; break; } }
  } else acc = 0;
  render();
  requestAnimationFrame(frame);
}

/* =========================================================
   BOOT
   ========================================================= */
document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });
window.addEventListener('pagehide', save);
$('sel-budget').innerHTML = BUDGETS.map((b, i) => `<option value="${i}">${b.n}</option>`).join('');
$('sel-budget').value = '1';
$('sel-focus').innerHTML = '<option value="-1">Balanced</option>' + STATS.map((s, i) => `<option value="${i}">${s}</option>`).join('');
$('sel-monet').innerHTML = MONET.map((m, i) => `<option value="${i}">${m.n}</option>`).join('');
$('sel-monet').value = '1';
refreshDevOptions();
$('sel-genre').value = 'Adventure'; $('sel-theme').value = 'Detective';
renderDevMode();
renderAll();
if (!STATE.trend) STATE.trend = { type: 'genre', n: pick(STATE.unlocked.g) };
updatePreview();
if (!STATE.history.length && !STATE.activeDev && STATE.cal.y === 1 && STATE.cal.m === 1 && STATE.cal.w === 1 && STATE.tick === 0) {
  showModal(`<h3>Welcome, President!</h3><div class="note">Pick a genre, theme, platform, publisher, budget and business model, then guide your team through Concept, Alpha, Beta and Debug. You'll pick a project lead, run a design meeting, react to playtests and decide when to ship.<br><br>
    Matching genres and themes make great combos, and each platform has favourite genres. Buy new platform licences and check publishers in the Market tab. GameCon arrives every August.<br><br>
    Released games keep earning in Live Ops. Contract work pays the bills between releases.<br><br>
    Payday is at the end of every month. Three months in the red and it's game over. Good luck!</div>`, [{ label: "Let's go!", cls: 'btn-accent' }]);
}
if (STATE.activeDev && STATE.activeDev.kind === 'game' && STATE.activeDev.balloon.hp <= 0) { STATE.activeDev.awaiting = false; checkPhase(); }
requestAnimationFrame(frame);
</script>
